DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fortnite Community Manager</title>

  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>

  <header>
    <h1>FORTNITE COMMUNITY MANAGER</h1>
    <p>Gerencie sua comunidade gamer.</p>
    <p>Status: Painel iniciado</p>
  </header>

  <section class="card">
    <h2>Discord</h2>
    <p>Integração com Discord em desenvolvimento.</p>

    <button id="connectDiscord">
      Conectar Discord
    </button>
  </section>

  <section class="card">
    <h2>Adicionar jogador</h2>

    <input
      id="player"
      type="text"
      placeholder="Nome do jogador"
    >

    <button id="addPlayer">
      Adicionar jogador
    </button>
  </section>

  <section class="card">
    <h2>Jogadores da comunidade</h2>
    <ul id="players"></ul>
  </section>

  <footer>
    Fortnite Community Manager © 2026
  </footer>

</body>
</html>
